name: Pages

# The web converter is the release: build engine.elf + WASM tools, verify, deploy site/.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'engine/**'
      - 'converter/assets/**'
      - 'converter/Directory.Build.props'  # <Version>, the web converter's version.js
      - 'scripts/build_wasm.sh'
      - 'scripts/wasm-shim/**'
      - 'scripts/gen_site_games.py'
      - 'scripts/gen_site_seo.py'
      - 'scripts/gen_site_i18n.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DEVKITARM_IMAGE: devkitpro/devkitarm:20260610
  EMSDK_VERSION: 4.0.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build engine.elf in devkitARM container
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo/engine \
            "$DEVKITARM_IMAGE" make
          test -s engine/engine.elf

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build WASM tools + stage static assets
        run: bash scripts/build_wasm.sh

      - name: Verify site gates (JS + tags + i18n + generated pages)
        run: |
          for f in site/app.js site/convert.js site/vendor/conv/*.js site/vendor/conv/*.mjs site/vendor/*.mjs site/vendor/bench/* scripts/gen_site_i18n.mjs; do
            node --check "$f"
          done
          python3 - << 'EOF'
          import html.parser
          class P(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.errs=[]
                  self.void={'meta','link','input','br','img','hr'}
              def handle_starttag(self, tag, attrs):
                  if tag not in self.void: self.stack.append((tag, self.getpos()))
              def handle_endtag(self, tag):
                  if tag in self.void: return
                  if self.stack and self.stack[-1][0]==tag: self.stack.pop()
                  else: self.errs.append(f'{tag}@{self.getpos()}')
          pages = ['site/index.html', 'site/convert.html', 'site/compat.html',
                   'site/en/index.html', 'site/en/convert.html', 'site/en/compat.html']
          for page in pages:
              p=P(); p.feed(open(page).read())
              assert not p.errs and not p.stack, f'{page}: {p.errs} {p.stack}'
          print('tags OK:', len(pages), 'pages')
          EOF
          node -e "
          const fs = require('node:fs');
          const src = fs.readFileSync('site/app.js', 'utf8');
          const en = new Function('return (' + src.match(/const EN = (\{[\s\S]*?\n\});/)[1] + ');')();
          for (const page of ['site/index.html', 'site/convert.html']) {
            const html = fs.readFileSync(page, 'utf8');
            const keys = [...html.matchAll(/data-i18n=\"([^\"]+)\"/g)].map(m => m[1]);
            for (const m of html.matchAll(/data-i18n-attr=\"([^\"]+)\"/g))
              for (const pair of m[1].split(',')) keys.push(pair.split(':')[1]);
            const missing = keys.filter(k => !(k in en));
            if (missing.length) { console.error(page, 'missing EN:', missing); process.exit(1); }
          }
          for (const page of ['site/en/index.html', 'site/en/convert.html']) {
            const html = fs.readFileSync(page, 'utf8');
            if (html.includes('data-i18n')) { console.error(page, 'still has i18n bindings'); process.exit(1); }
            if (/[\uac00-\ud7a3]/.test(html)) { console.error(page, 'still has Korean text'); process.exit(1); }
          }
          console.log('i18n OK');
          "
          # Generated pages must match their sources (#130): a stale commit fails here.
          python3 scripts/gen_site_games.py > /dev/null
          node scripts/gen_site_i18n.mjs --check
          python3 scripts/gen_site_seo.py --check
          git diff --exit-code -- site/games.js site/compat.html site/en/compat.html site/sitemap.xml || {
            echo 'generated site files are out of date (site/games.js, site/compat.html, site/en/compat.html, site/sitemap.xml)'; exit 1; }

      - name: Run converter module tests
        run: |
          cd site/vendor/conv && npm i --no-save adm-zip zstd-codec > /dev/null 2>&1
          node conv.test.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
