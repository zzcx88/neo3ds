name: Pages

# The web converter is the release: build engine.elf + WASM tools, verify, deploy site/.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'engine/**'
      - 'converter/assets/**'
      - 'converter/Directory.Build.props'  # <Version>, the web converter's version.js
      - 'scripts/build_wasm.sh'
      - 'scripts/wasm-shim/**'
      - 'scripts/gen_site_games.py'
      - 'scripts/gen_site_seo.py'
      - 'scripts/gen_site_i18n.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No workflow-level concurrency: pull_request runs share this workflow with
# main deploys, so a workflow-level group lets a PR gate run cancel an
# in-flight main deploy (#155). Deploy-path jobs share one group instead.

env:
  DEVKITARM_IMAGE: devkitpro/devkitarm:20260610
  EMSDK_VERSION: 4.0.10

jobs:
  # Pull requests run the gates only: no devkitARM/WASM build needed for them.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Own group: PR gate runs never enter the deploy group.
    concurrency:
      group: site-gates-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/site_gate.sh

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deploy path shares one group: a newer main/dispatch run cancels a stale
    # build or deploy, and PR runs can never cancel it (#155).
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Build engine.elf in devkitARM container
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo/engine \
            "$DEVKITARM_IMAGE" make
          test -s engine/engine.elf

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build WASM tools + stage static assets
        run: bash scripts/build_wasm.sh

      - name: Verify site gates (scripts/site_gate.sh)
        run: bash scripts/site_gate.sh

      - name: Run converter module tests
        run: |
          cd site/vendor/conv && npm i --no-save adm-zip zstd-codec > /dev/null 2>&1
          node conv.test.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
