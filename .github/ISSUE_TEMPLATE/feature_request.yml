name: 기능 제안
description: 새 기능이나 동작 변경을 제안합니다.
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 지금 무엇이 불편한지 적어 주세요. 기능 이름보다 상황이 중요합니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 원하는 동작과 사용자가 느끼는 변화를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 다른 방법이나 이미 시도한 우회 방법이 있으면 적어 주세요.

  - type: dropdown
    id: area
    attributes:
      label: 영향 범위
      multiple: true
      options:
        - 엔진 (engine/)
        - 웹 변환기 (사이트)
        - 오프라인 변환기 (Windows)
        - 오프라인 변환기 (Linux·macOS)
        - 사이트·문서
        - 릴리스·CI
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 같은 제안의 이슈가 이미 있는지 검색했습니다
          required: true
